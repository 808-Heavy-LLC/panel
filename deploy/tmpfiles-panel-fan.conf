# Quieter thermal trip points for the panel kiosk (Pi 4B pwm-fan).
#
# Pi 4B defaults are 40/45/50/55°C — too twitchy for an always-on
# kiosk. These values keep the fan off until 60°C and ramp it through
# 65/70/75°C up to max speed.
#
# Note: the dtparam=fan_temp* directives in /boot/firmware/config.txt
# do NOT work on Pi OS Trixie's device tree for this Pi — the trip
# points are only writable via sysfs. systemd-tmpfiles applies these
# at every boot via systemd-tmpfiles-setup.service.
#
# Install:
#   sudo cp deploy/tmpfiles-panel-fan.conf /etc/tmpfiles.d/panel-fan.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/panel-fan.conf
#
# Hyst values are read-only via sysfs; the kernel-set defaults stay in place.

w /sys/class/thermal/thermal_zone0/trip_point_3_temp - - - - 60000
w /sys/class/thermal/thermal_zone0/trip_point_2_temp - - - - 65000
w /sys/class/thermal/thermal_zone0/trip_point_1_temp - - - - 70000
w /sys/class/thermal/thermal_zone0/trip_point_0_temp - - - - 75000
